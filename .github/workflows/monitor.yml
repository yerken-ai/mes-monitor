name: MES Almaty Telegram Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим работы'
        required: false
        default: 'bot'
        type: choice
        options:
          - bot
          - once
  schedule:
    # Перезапуск каждые 5 часов для непрерывной автономной работы 24/7
    - cron: '0 */5 * * *'

concurrency:
  group: mes-almaty-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Telegram Bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: '330'
        run: |
          MODE="${{ github.event.inputs.mode || 'bot' }}"
          echo "Запуск в режиме: $MODE"
          python monitor.py "$MODE"

          # Если работали в режиме постоянного бота, запускаем следующий сеанс
          if [ "$MODE" = "bot" ]; then
            echo "Сеанс завершен, запускаем следующий рабочий цикл..."
            gh workflow run monitor.yml -R "${{ github.repository }}" || true
          fi

      # Если при работе был обновлен токен сессии MES и задан GH_PAT, обновляем секрет
      - name: Update secret AUTH_STATE_JSON if refreshed
        if: always() && env.GH_PAT != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f refreshed_auth.json ]; then
            gh secret set AUTH_STATE_JSON -R "${{ github.repository }}" < refreshed_auth.json
            echo "Секрет AUTH_STATE_JSON успешно обновлен."
          fi
