name: MES Almaty Line Status

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим работы'
        required: false
        default: 'status'
        type: choice
        options:
          - status
          - daemon
  repository_dispatch:
    types: [status, check]

concurrency:
  group: mes-almaty-monitor
  cancel-in-progress: true

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Автоматическое продление токена сессии MES (сохраняет в secret AUTH_STATE_JSON)
      - name: Refresh MES session cookies
        if: env.GH_PAT != ''
        env:
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python monitor.py refresh
          if [ -f refreshed_auth.json ]; then
            gh secret set AUTH_STATE_JSON -R "${{ github.repository }}" < refreshed_auth.json
            rm -f refreshed_auth.json
          fi

      - name: Fetch Almaty status and send screenshot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
          LINE_NAME: "Алматы"
        run: |
          MODE="${{ github.event.inputs.mode || 'status' }}"
          python monitor.py "$MODE"
